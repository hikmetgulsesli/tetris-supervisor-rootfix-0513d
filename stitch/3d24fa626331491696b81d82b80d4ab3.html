<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Tetris Supervisor - Main Menu</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;700;800&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-dim": "#0e1416",
                        "surface-container-low": "#171d1e",
                        "primary": "#4cd7f6",
                        "primary-fixed-dim": "#4cd7f6",
                        "on-surface-variant": "#bcc9cd",
                        "tertiary-fixed": "#ffdcbf",
                        "on-error": "#690005",
                        "primary-container": "#06b6d4",
                        "surface": "#0e1416",
                        "surface-container-highest": "#303638",
                        "tertiary": "#ffb873",
                        "on-tertiary": "#4b2800",
                        "on-error-container": "#ffdad6",
                        "surface-container-lowest": "#090f11",
                        "on-tertiary-fixed-variant": "#6a3b00",
                        "error": "#ffb4ab",
                        "on-secondary-fixed": "#2c0051",
                        "inverse-surface": "#dee3e6",
                        "background": "#0e1416",
                        "secondary-fixed": "#f0dbff",
                        "surface-bright": "#343a3c",
                        "surface-variant": "#303638",
                        "secondary-fixed-dim": "#ddb7ff",
                        "surface-tint": "#4cd7f6",
                        "on-secondary-container": "#d6a9ff",
                        "outline-variant": "#3d494c",
                        "on-tertiary-container": "#5b3200",
                        "on-surface": "#dee3e6",
                        "on-primary": "#003640",
                        "tertiary-container": "#e89337",
                        "secondary-container": "#6f00be",
                        "primary-fixed": "#acedff",
                        "on-tertiary-fixed": "#2d1600",
                        "on-primary-fixed": "#001f26",
                        "on-primary-fixed-variant": "#004e5c",
                        "on-background": "#dee3e6",
                        "outline": "#869397",
                        "inverse-on-surface": "#2b3133",
                        "inverse-primary": "#00687a",
                        "error-container": "#93000a",
                        "surface-container": "#1b2122",
                        "on-secondary": "#490080",
                        "tertiary-fixed-dim": "#ffb873",
                        "surface-container-high": "#252b2d",
                        "on-primary-container": "#00424f",
                        "secondary": "#ddb7ff",
                        "on-secondary-fixed-variant": "#6900b3"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "lg": "24px",
                        "xl": "48px",
                        "sm": "8px",
                        "xs": "4px",
                        "safe-area": "24px",
                        "touch-target-min": "44px",
                        "gutter": "16px",
                        "unit": "4px",
                        "md": "16px"
                    },
                    "fontFamily": {
                        "hud-label": ["JetBrains Mono"],
                        "button-text": ["Hanken Grotesk"],
                        "body-base": ["Hanken Grotesk"],
                        "hud-value": ["JetBrains Mono"],
                        "headline-md": ["Hanken Grotesk"],
                        "display-lg": ["Hanken Grotesk"]
                    },
                    "fontSize": {
                        "hud-label": ["12px", { "lineHeight": "16px", "letterSpacing": "0.1em", "fontWeight": "500" }],
                        "button-text": ["14px", { "lineHeight": "1", "letterSpacing": "0.02em", "fontWeight": "600" }],
                        "body-base": ["16px", { "lineHeight": "1.5", "fontWeight": "400" }],
                        "hud-value": ["20px", { "lineHeight": "24px", "fontWeight": "700" }],
                        "headline-md": ["24px", { "lineHeight": "1.2", "fontWeight": "700" }],
                        "display-lg": ["48px", { "lineHeight": "1.1", "letterSpacing": "-0.02em", "fontWeight": "800" }]
                    }
                }
            }
        }
    </script>
<style>
        .neon-glow {
            box-shadow: 0 0 10px rgba(76, 215, 246, 0.4);
        }
        .neon-glow:hover {
            box-shadow: 0 0 15px rgba(76, 215, 246, 0.6);
        }
        .bg-pattern {
            background-image: radial-gradient(circle at 2px 2px, #334155 1px, transparent 0);
            background-size: 24px 24px;
        }
    </style>
</head>
<body class="bg-[#0F172A] text-on-surface h-screen w-screen overflow-hidden flex flex-col items-center justify-center relative bg-pattern">
<!-- Background Decoration (Falling Blocks Simulation) -->
<div class="absolute inset-0 z-0 pointer-events-none opacity-20">
<div class="absolute top-[10%] left-[20%] w-12 h-12 border-2 border-primary rounded shadow-[0_0_10px_rgba(76,215,246,0.4)]"></div>
<div class="absolute top-[40%] right-[15%] w-24 h-12 border-2 border-secondary rounded shadow-[0_0_10px_rgba(221,183,255,0.4)]"></div>
<div class="absolute bottom-[20%] left-[30%] w-12 h-24 border-2 border-tertiary rounded shadow-[0_0_10px_rgba(255,184,115,0.4)]"></div>
</div>
<!-- Main Content Container -->
<div class="z-10 flex flex-col items-center w-full max-w-md px-gutter">
<!-- Title Section -->
<div class="mb-xl text-center">
<h1 class="font-display-lg text-display-lg text-primary tracking-tighter drop-shadow-[0_0_15px_rgba(76,215,246,0.3)]">
                TETRIS
                <br/>
<span class="text-on-surface">SUPERVISOR</span>
</h1>
<p class="font-hud-label text-hud-label text-on-surface-variant mt-sm uppercase">Grandmaster Edition</p>
</div>
<!-- Action Buttons -->
<div class="w-full flex flex-col gap-sm">
<!-- Primary Action -->
<button class="w-full h-touch-target-min bg-surface border border-primary text-primary font-button-text text-button-text rounded flex items-center justify-center gap-xs neon-glow transition-all active:scale-95">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">play_arrow</span>
                New Game
            </button>
<!-- Secondary Actions -->
<button class="w-full h-touch-target-min bg-surface border border-outline-variant text-on-surface font-button-text text-button-text rounded flex items-center justify-center gap-xs hover:border-primary hover:text-primary transition-colors active:scale-95">
<span class="material-symbols-outlined">gamepad</span>
                Controls
            </button>
<button class="w-full h-touch-target-min bg-surface border border-outline-variant text-on-surface font-button-text text-button-text rounded flex items-center justify-center gap-xs hover:border-primary hover:text-primary transition-colors active:scale-95">
<span class="material-symbols-outlined">settings</span>
                Settings
            </button>
</div>
</div>
<!-- Version Info -->
<div class="absolute bottom-gutter right-gutter z-10">
<span class="font-hud-label text-hud-label text-on-surface-variant opacity-50">Version 0513d</span>
</div>
</body></html>
